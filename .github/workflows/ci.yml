name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pull-request-title:
    name: Pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the Conventional Commits format
        env:
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|refactor|test|docs|chore|ci|perf)(\((shared|backend|frontend|deps)\))?!?: [a-z].*[^.]$'
          if ! printf '%s' "$PULL_REQUEST_TITLE" | grep -Eq "$pattern"; then
            echo "::error::The pull request title must follow Conventional Commits, for example 'feat(backend): add user management'. See CONTRIBUTING.md."
            exit 1
          fi

  checks:
    name: Checks
    if: github.event_name == 'push' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install the pnpm version from packageManager
        run: npm install -g "$(node -p "require('./package.json').packageManager")"

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  docker-images:
    name: Docker images
    if: github.event_name == 'push' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the API and panel images
        run: docker compose build api panel

      - name: Create the demo gym
        run: docker compose --profile seed run --rm seed

      - name: Start the API and the panel
        run: docker compose up --detach --wait

      - name: Sign in through the panel and read the dashboard numbers
        run: |
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 2 --output /dev/null http://localhost:3000/login
          curl --fail --silent --show-error --output /dev/null --cookie-jar "$RUNNER_TEMP/cookies.txt" --header "Content-Type: application/json" --header "Origin: http://localhost:3000" --data '{"username":"admin","password":"admin123"}' http://localhost:3000/api/auth/login
          curl --fail --silent --show-error --output /dev/null --cookie "$RUNNER_TEMP/cookies.txt" http://localhost:3000/api/assessments/summary

      - name: Show the container logs
        if: failure()
        run: docker compose logs

      - name: Stop the containers
        if: always()
        run: docker compose down --volumes
